<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <rect width="240" height="160" fill="#f8f5fc"/>
  <!-- bowel wall layers, left = lumen -->
  <rect x="30" y="35" width="150" height="18" fill="#C0392B" opacity="0.75"/>
  <rect x="30" y="53" width="150" height="18" fill="#E67E22" opacity="0.55"/>
  <rect x="30" y="71" width="150" height="20" fill="#e8d9f5"/>
  <rect x="30" y="35" width="150" height="56" fill="none" stroke="#7C4DBC" stroke-width="1.5"/>
  <text x="185" y="47" font-size="7" fill="#C0392B">موکوزا</text>
  <text x="185" y="65" font-size="7" fill="#B9770E">ساب‌موکوزا</text>
  <text x="185" y="84" font-size="7" fill="#7C4DBC">مسکولاریس/سروزا</text>
  <!-- depth arrows -->
  <text x="30" y="108" font-size="6.5" fill="#C0392B">Mucosal</text>
  <text x="80" y="108" font-size="6.5" fill="#B9770E">Mural</text>
  <text x="128" y="108" font-size="6.5" fill="#7C4DBC">Transmural</text>
  <path d="M30,112 L175,112" stroke="#1b2430" stroke-width="0.8" opacity="0.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1b2430" opacity="0.5"/></marker></defs>
  <text x="120" y="126" font-size="6.5" fill="#1b2430" opacity="0.6" text-anchor="middle">عمق انفارکت با شدت/کامل‌بودن انسداد عروقی افزایش می‌یابد</text>
  <text x="120" y="150" font-family="sans-serif" font-size="7.5" fill="#1b2430" text-anchor="middle" opacity="0.55">Ischemic bowel disease — depth of infarction (colon = most common site)</text>
</svg>
