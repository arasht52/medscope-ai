<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <rect width="240" height="160" fill="#f8f5fc"/>
  <!-- uterus outline -->
  <path d="M80,40 Q120,28 160,40 L168,95 Q120,140 72,95 Z" fill="none" stroke="#7C4DBC" stroke-width="2"/>
  <!-- three fibroid locations -->
  <circle cx="120" cy="62" r="11" fill="#9B59B6" opacity="0.55"/>
  <text x="120" y="64" font-size="5" fill="#fff" text-anchor="middle">اینترامورال</text>
  <circle cx="98" cy="90" r="8" fill="#9B59B6" opacity="0.55"/>
  <text x="98" y="105" font-size="5" fill="#7C4DBC" text-anchor="middle">ساب‌موکوزال</text>
  <circle cx="158" cy="72" r="8" fill="#9B59B6" opacity="0.55"/>
  <text x="176" y="72" font-size="5" fill="#7C4DBC" text-anchor="middle">ساب‌سروزال</text>
  <text x="120" y="126" font-size="6.5" fill="#1b2430" opacity="0.6" text-anchor="middle">لیومیوم: خوش‌مرز، الگوی گردابی (whorled)، میتوز نادر</text>
  <text x="120" y="150" font-family="sans-serif" font-size="7.5" fill="#1b2430" text-anchor="middle" opacity="0.55">Uterine leiomyoma — three locations (intramural / submucosal / subserosal)</text>
</svg>
