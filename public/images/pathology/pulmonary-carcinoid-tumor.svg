<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 810" width="480" height="810" role="img" aria-labelledby="title desc" lang="fa">
  <title id="title">طرح مفهومی معماری لانه‌ای و روزتی در کارسینوئید ریه</title>
  <desc id="desc">دو آرایش مفهومی سلول‌های توموری: لانه‌ای در چپ و روزتی پیرامون فضای مرکزی در راست. هر سلول حاشیهٔ قهوه‌ای و هستهٔ بنفش دارد. این طرح برای تعیین تشخیص، درجه یا زیرنوع کافی نیست.</desc>
  <style>text{font-family:Tahoma,Arial,sans-serif;fill:#253044}.fa{direction:rtl;unicode-bidi:plaintext}</style>
  <rect width="480" height="810" rx="16" fill="#f8f5fc"/>
  <text class="fa" x="240" y="34" text-anchor="middle" font-size="24">کارسینوئید ریه؛ طرح مفهومی</text>
  <text x="240" y="64" text-anchor="middle" font-size="20">Pulmonary carcinoid architecture</text>
  <rect x="16" y="90" width="216" height="274" rx="12" fill="#fff" stroke="#ddd4e7"/>
