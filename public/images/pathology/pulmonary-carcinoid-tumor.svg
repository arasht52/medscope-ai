  <text class="fa" x="240" y="402" text-anchor="middle" font-size="21">راهنمای نمادها</text>
  <ellipse cx="420" cy="448" rx="28" ry="18" fill="#f7dec0" stroke="#9a612a" stroke-width="2"/>
  <text class="fa" x="378" y="455" font-size="20">سلول؛ مرز قهوه‌ای</text>
  <circle cx="420" cy="496" r="8" fill="#654482"/>
  <text class="fa" x="378" y="503" font-size="20">هسته؛ دایرهٔ بنفش</text>
  <text class="fa" x="448" y="550" font-size="20">در چپ: تجمع چند سلول در یک لانه</text>
  <text class="fa" x="448" y="586" font-size="20">در راست: آرایش شعاعی سلول‌ها</text>
  <text class="fa" x="448" y="622" font-size="20">پیرامون فضای مرکزی؛ نشان C</text>
  <rect x="20" y="652" width="440" height="102" rx="12" fill="#eef4fb"/>
  <text class="fa" x="240" y="681" text-anchor="middle" font-size="20">این طرح، درجه یا زیرنوع تومور</text>
  <text class="fa" x="240" y="712" text-anchor="middle" font-size="20">را تعیین نمی‌کند و برای تشخیص کافی نیست.</text>
  <text class="fa" x="240" y="741" text-anchor="middle" font-size="18">مقیاس و رنگ‌ها نمادین‌اند.</text>
  <text class="fa" x="240" y="785" text-anchor="middle" font-size="19">مقطع بافتی واقعی یا رنگ‌آمیزی H&amp;E نیست.</text>
